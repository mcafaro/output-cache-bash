# This is a basic workflow to help you get started with MATLAB Actions

name: outputCache Bash

# Controls when the action will run. 
on:
  push:
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      
      # Sets up MATLAB on a GitHub-hosted runner
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
            cache: true

      - name: Run build
        uses: matlab-actions/run-build@v3
        with:
            build-options: -outputCache
            cache: true
      
      # The "clean" task deletes outputs and traces of the other tasks in the plan, but it does not operate on cached outputs.
      - name: Run build
        uses: matlab-actions/run-build@v3
        with:
            tasks: clean

      # Run a new build using the output cache. 
      # The build tool does not run the "test" task to regenerate its deleted outputs.
      # Instead, it skips the task and loads the cached outputs.  
      - name: Run build
        uses: matlab-actions/run-build@v3
        with:
            build-options: -outputCache
            cache: true

      # Run another build. The build tool again skips the "test" task because the task is up to date.
      - name: Run build
        uses: matlab-actions/run-build@v3
        with:
            build-options: -outputCache
            cache: true