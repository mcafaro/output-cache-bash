# Shares job id "collide" with bash-collide-b.yml. The cache key includes the job id but not
# the workflow, so the two workflows may share a cache. Run A, then B.
name: Bash - Collide A

on: workflow_dispatch

jobs:
  collide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
            cache: true

      - name: Run build
        uses: matlab-actions/run-build@v3
        env:
            BASH_RUN_LOG: ${{ runner.temp }}/run.log
        with:
            tasks: stamp
            build-options: -outputCache
            cache: true
